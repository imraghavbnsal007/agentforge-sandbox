name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run irrelevant; cancelling keeps
# feedback fast and the runner minutes honest. `main` is exempt, so a merged
# commit is always fully verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The suite runs against in-memory SQLite, so no PostgreSQL or Redis
      # service is needed. Some tests shell out to git, which the runner has.
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm test

      # Catches what typecheck and unit tests cannot: a server component that
      # only fails when Next actually renders it.
      - name: Production build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Validates the compose file and every ${VAR:-default} in it. Cheap, and
      # a broken compose file is the first thing a visitor would hit.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
