services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@postgres:5432/agentforge
      REDIS_URL: redis://redis:6379/0
      AGENT_MODE: ${AGENT_MODE:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      SAMPLE_REPO_PATH: /sample_repo
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS:-}
      # --- Authentication (Phase 6A) ---
      # "local" keeps the single-user PAT workflow; "github_app" requires
      # GitHub sign-in.
      AUTH_MODE: ${AUTH_MODE:-local}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_COMMIT_NAME: ${GITHUB_APP_COMMIT_NAME:-}
      GITHUB_APP_COMMIT_EMAIL: ${GITHUB_APP_COMMIT_EMAIL:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:8000/api/v1/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Secure cookies require HTTPS — enable in production only.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # Public portfolio demonstration. Off by default; see
      # docs/DEPLOYMENT_RECOMMENDATION.md before turning it on.
      SHOWCASE_MODE: ${SHOWCASE_MODE:-false}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./sample_repo:/sample_repo:ro
      # Read-only: the GitHub App private key. Contents are gitignored;
      # in production mount a real secret here instead.
      - ./secrets:/run/secrets:ro
      # Read-only: /health reports backup freshness; nothing in the
      # containers can write or delete backups.
      - ./backups:/backups:ro
      # Read-only: lets the in-container test suite verify the ops safety
      # rules (Makefile has no 'down -v', scripts use set -euo pipefail...).
      - ./Makefile:/repo/Makefile:ro
      - ./scripts:/repo/scripts:ro
      - ./.gitignore:/repo/.gitignore:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    environment: *backend-env
    command: arq app.worker.settings.WorkerSettings
    volumes:
      - ./backend:/app
      - ./sample_repo:/sample_repo:ro
      # The worker mints installation tokens for clone/push/PR, so it needs
      # the GitHub App private key exactly as the backend does.
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      # Server-side calls stay on the Docker network.
      API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      # Browser-side calls. This one is baked into the client bundle, so a
      # deployment behind any hostname other than localhost MUST set it —
      # it was previously hardcoded, which silently broke every non-local
      # deployment.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Reliable file watching for HMR across the macOS/Windows bind mount.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules and .next stay container-private: host-side builds or
      # deletes must never touch the dev server's live build state.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
